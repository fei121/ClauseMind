services:
  redis:
    image: redis:7.4-alpine
    container_name: clausemind-demo-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - clausemind_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: clausemind-demo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: change-me-root
      MYSQL_DATABASE: clausemind_demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: change-me
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - clausemind_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  clausemind_redis_data:
  clausemind_mysql_data:
